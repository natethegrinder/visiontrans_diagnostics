project:
  name: visiontrans_diagnostics
  seed: 42
  device: auto

data:
  dataset: nih_chest_xray
  raw_dir: data/raw
  annotations_dir: data/annotations
  processed_dir: data/processed
  manifest_dir: data/manifests
  train_manifest: data/manifests/train.csv
  val_manifest: data/manifests/val.csv
  test_manifest: data/manifests/test.csv
  image_size: 224
  num_channels: 1
  num_classes: 14
  batch_size: 32
  num_workers: 4
  val_fraction: 0.1
  pos_weight_clamp: 50
  augmentation:
    enabled: false
    # Chest X-rays are laterality-sensitive, so keep flips opt-in.
    allow_horizontal_flip: false
    horizontal_flip_prob: 0.5
    rotation_degrees: 10
    color_jitter_brightness: 0.2
    color_jitter_contrast: 0.2
    crop_type: none
    crop_scale:
  normalize_mean: [0.5]
  normalize_std: [0.25]

training:
  epochs: 30
  optimizer: adamw
  learning_rate: 0.0001
  weight_decay: 0.0001
  loss: bce_with_logits
  use_amp: false
  use_pos_weight: true
  focal_gamma: 2.0
  focal_alpha: 0.25
  scheduler: cosine
  warmup_epochs: 0
  threshold: 0.5
  tune_thresholds: false
  threshold_tuning_objective: f1
  threshold_grid:
  gradient_clip_norm:
  checkpoint_dir: artifacts/models
  early_stopping_patience: 5

evaluation:
  metrics:
    - accuracy
    - f1
    - roc_auc
    - confusion_matrix

mlflow:
  tracking_uri: mlruns
  experiment_name: vit_baseline_nih
  log_artifacts: true

runtime:
  max_train_batches:
  max_val_batches:
  progress_log_interval: 50
