extends: cnn_densenet121_baseline.yaml

run:
  name: cnn_densenet121_smoke
  type: smoke_test

project:
  device: auto

data:
  num_workers: 0

model:
  pretrained: false
  dropout: 0.2

training:
  epochs: 1
  batch_size: 8
  learning_rate: 0.0001
  weight_decay: 0.0001
  scheduler: none
  progress_interval: 5

smoke_test:
  enabled: true
  max_train_samples: 128
  max_val_samples: 64
  max_test_samples: 64

artifacts:
  model_dir: artifacts/models
  metrics_dir: artifacts/metrics
