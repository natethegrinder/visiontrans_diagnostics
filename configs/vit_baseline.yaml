extends: base.yaml

run:
  name: vit_tiny_baseline
  type: architecture_comparison

model:
  family: vit
  architecture: vit_tiny
  pretrained: false
  patch_size: 16
  hidden_dim: 192
  num_heads: 6
  num_layers: 6
  dim_feedforward: 768
  dropout: 0.1
  norm_first: true

training:
  learning_rate: 0.0001
  batch_size: 16
  scheduler: warmup_cosine
  warmup_epochs: 5

mlflow:
  tracking_uri: "http://127.0.0.1:5050"
  experiment_name: "cnn_vs_vit_medical"
