experiment_name: experiment_1_vit_baseline_metrics
description: >
  Pilot-first ViT-from-scratch architecture screening. Start with the single
  pilot variant before any coarse-grid runs because larger ViT variants can be
  time-consuming on local hardware.
default_output_dir: artifacts/experiments/experiment_1
default_pilot_variant: vit_tiny_6l_192d_p16_pilot

runtime_defaults:
  epochs_override: 3
  max_runs:
  max_train_batches:
  max_val_batches:
  num_workers_override: 0

variants:
  - name: vit_tiny_6l_192d_p16_pilot
    intent: Short pilot to estimate per-epoch runtime for the default ViT baseline.
    overrides:
      model.hidden_dim: 192
      model.num_heads: 6
      model.num_layers: 6
      model.dim_feedforward: 768
      model.patch_size: 16
      model.dropout: 0.1
      training.learning_rate: 0.0001
      training.scheduler: cosine
      training.warmup_epochs: 0
      training.loss: bce_with_logits
      training.use_pos_weight: true

  - name: vit_tiny_4l_192d_p16
    intent: Smaller-depth coarse-grid baseline.
    overrides:
      model.hidden_dim: 192
      model.num_heads: 6
      model.num_layers: 4
      model.dim_feedforward: 768
      model.patch_size: 16
      model.dropout: 0.1

  - name: vit_tiny_6l_192d_p16
    intent: Default tiny baseline for coarse-grid screening.
    overrides:
      model.hidden_dim: 192
      model.num_heads: 6
      model.num_layers: 6
      model.dim_feedforward: 768
      model.patch_size: 16
      model.dropout: 0.1

  - name: vit_tiny_8l_192d_p16
    intent: Deeper tiny baseline to probe depth sensitivity.
    overrides:
      model.hidden_dim: 192
      model.num_heads: 6
      model.num_layers: 8
      model.dim_feedforward: 768
      model.patch_size: 16
      model.dropout: 0.1

  - name: vit_small_6l_384d_p16
    intent: Optional higher-capacity variant if runtime and memory are acceptable.
    overrides:
      model.hidden_dim: 384
      model.num_heads: 6
      model.num_layers: 6
      model.dim_feedforward: 1536
      model.patch_size: 16
      model.dropout: 0.1
